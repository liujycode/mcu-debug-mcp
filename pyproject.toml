[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-debug-mcp"
# 版本单一来源：src/mcu_debug_mcp/__init__.py（2026-10-13 C 档重构引入，
# 此前 pyproject 与文档各写一份，靠人肉对齐必然过期）
dynamic = ["version"]
description = "嵌入式硬件调试 MCP：串口直连 + 直连调试器读芯片身份/复位原因 + 烧录后逐字节校验 + 45 条异常模式库 + 三引擎引脚检测 + 板级知识库 + 会话持久化 + 预验证驱动库 + 报文解析（自定义帧/NMEA）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcu-debug-mcp contributors" }]
keywords = ["mcp", "embedded", "serial", "stm32", "esp32", "arduino", "graduation-project"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Embedded Systems",
]
# 核心依赖只有 MCP 框架本身；串口/烧录能力按需安装（优雅降级不炸）
# ★ 下界与 requirements.txt 对齐（2026-10-13 审查：两处曾一个写 1.0 一个写 1.2.0，
#   装出来的版本行为不一致；mcp 2.x 改了 FastMCP 入口名，实测炸 server.py，故钉 <2 语义由
#   tests/test_server_smoke 类守护——升级前先跑它）
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/liujycode/mcu-debug-mcp"
Repository = "https://github.com/liujycode/mcu-debug-mcp"
Issues = "https://github.com/liujycode/mcu-debug-mcp/issues"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
debug = ["pyocd>=0.36"]
all = ["pyserial>=3.5", "pyocd>=0.36"]

[project.scripts]
mcu-debug-mcp = "mcu_debug_mcp.server:main"

# ---------------------------------------------------------------------------
# src 布局（2026-10-13 C 档重构）
# 为什么必须 src/：平铺布局下 wheel 顶层是 core.py / tools/ —— `core` 与 `tools`
# 是 PyPI 生态里最泛滥的通用名，pip 静默覆盖不报错，装一次污染一次别人的环境。
# knowledge/ drivers/ tools/ 物理放在包内（单一事实来源），靠 include-package-data
# + MANIFEST.in 的 prune 规则进 sdist/wheel —— 不再用 setup.py 的 build_py 钩子
# 整目录复制（那条路正是「sdist 空壳」P0 的温床：钩子只盖 wheel 直构路径）。
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mcu_debug_mcp.__version__" }
